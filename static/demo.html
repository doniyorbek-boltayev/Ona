<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <title>Nigoh AI Stage View</title>
  <style>
    html, body { height: 100%; margin: 0; background: #15262A; font: 14px -apple-system, "Segoe UI", Roboto, sans-serif; color: #cfe3e6; }
    body { display: grid; grid-template-columns: 420px 1fr; gap: 22px; padding: 18px 22px; box-sizing: border-box; }
    .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
    .label { display: flex; justify-content: space-between; align-items: center; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; font-size: 12px; opacity: .85; }
    iframe { flex: 1; width: 100%; border: 0; border-radius: 26px; background: #FBF7F1; }
    .col:last-child iframe { border-radius: 16px; }
    button { font: inherit; font-size: 12px; color: #cfe3e6; background: rgba(255,255,255,.1); border: 0; border-radius: 8px; padding: 5px 10px; cursor: pointer; }
    select { font: inherit; font-size: 12px; border-radius: 8px; border: 0; padding: 4px 6px; }
  </style>
</head>
<body>
  <div class="col">
    <div class="label"><span>📱 Mother's phone</span>
      <select id="who" aria-label="Patient"></select></div>
    <iframe id="phone" src="/?p=1" title="Mother app"></iframe>
  </div>
  <div class="col">
    <div class="label"><span>🏥 Clinic dashboard — updates live</span><button id="reset">↺ Reset demo data</button></div>
    <iframe id="clinic" src="/clinic" title="Clinic dashboard"></iframe>
  </div>
  <script>
    const who = document.getElementById("who"), phone = document.getElementById("phone"), clinic = document.getElementById("clinic");
    fetch("/api/demo/personas").then((r) => r.json()).then((d) => {
      d.personas.forEach((p) => who.add(new Option(p.name + " · week " + p.week, p.id)));
      who.value = 1;
    });
    who.onchange = () => { phone.src = "/?p=" + who.value; };
    document.getElementById("reset").onclick = async () => {
      await fetch("/api/demo/reset", { method: "POST" });
      phone.src = phone.src; clinic.src = clinic.src;
    };
  </script>
</body>
</html>
